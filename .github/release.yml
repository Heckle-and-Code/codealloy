# GitHub Automatic Release Notes Configuration
# Documentation: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  categories:
    - title: "🚀 Exciting New Features"
      labels:
        - "feature"
        - "enhancement"
      collapse_after: 10
    - title: "🤖 Autonomous Engine & Models"
      labels:
        - "models"
        - "engine"
        - "agent"
    - title: "🎛️ Workbench & Autonomy Dial"
      labels:
        - "ui"
        - "autonomy"
        - "diffs"
    - title: "⏪ Shadow Git & Time-Travel"
      labels:
        - "shadow-git"
        - "rollback"
    - title: "🧩 Extension Ecosystem & Marketplace"
      labels:
        - "extensions"
        - "open-vsx"
    - title: "🐛 Bug Fixes"
      labels:
        - "fix"
        - "bug"
    - title: "⚡ Performance Improvements"
      labels:
        - "performance"
        - "perf"
    - title: "📦 Packaging, Installers & CI/CD"
      labels:
        - "packaging"
        - "ci"
        - "release"
    - title: "📖 Documentation & Branding"
      labels:
        - "documentation"
        - "docs"
        - "branding"
    - title: "🔧 Maintenance & Internal Tooling"
      labels:
        - "chore"
        - "refactor"
        - "dependencies"

  exclude:
    labels:
      - "ignore-for-release"
      - "skip-changelog"
